version: "1"

services:
  # 1. The FastAPI Docker Web Service
  - type: web
    name: fintech-api-gateway
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-postgres
          property: connectionString
      
      - key: REDIS_URL
        fromService:
          type: redis
          name: fintech-redis
          property: connectionString
   
      - key: GROQ_API_KEY
        sync: false 

  # 2. The Stateless Redis Queue
  - type: redis
    name: fintech-redis
    plan: free
    ipAllowList: [] 

databases:
  # 3. The PostgreSQL Time-Series Storage
  - name: fintech-postgres
    databaseName: fintech_db
    user: admin
    plan: free