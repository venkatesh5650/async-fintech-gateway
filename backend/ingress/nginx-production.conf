# ==============================================================================
# ZERO-TRUST PRODUCTION REVERSE PROXY & EDGE INGRESS SPECIFICATION
# Fintech API Gateway • Institutional High-Frequency Trading & Research Gateway
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Institutional JSON Logging with W3C Tracecontext
    log_format json_analytics escape=json
      '{"time_local":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_traceparent":"$http_traceparent",'
      '"http_x_request_id":"$http_x_request_id",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Edge Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=m2m_api_limit:10m rate=1000r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Upstream Clusters
    upstream fintech_fastapi_cluster {
        server fintech_api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream fintech_nextjs_cluster {
        server fintech_frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP -> HTTPS Apex Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name fintech-gateway.live *.fintech-gateway.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Production HTTPS Gateway (API & WebSocket Subdomain)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.fintech-gateway.live ws.fintech-gateway.live;

        # TLS 1.3 Termination & Strong Elliptic Curve Ciphers
        ssl_certificate /etc/letsencrypt/live/fintech-gateway.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fintech-gateway.live/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # SSL Session Cache & OCSP Stapling (A+ Rating)
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Zero-Trust Institutional Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://ws.fintech-gateway.live https://api.fintech-gateway.live;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Root Edge Health Probe
        location = /healthz {
            access_log off;
            return 200 '{"status":"EDGE_HEALTHY","protocol":"TLSv1.3","ingress":"nginx"}';
            add_header Content-Type application/json;
        }

        # WebSocket Tunneling for Real-Time Telemetry
        location /ws {
            limit_conn addr_conn_limit 50;

            proxy_pass http://fintech_fastapi_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Long keepalive timeout for financial ticker stream
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Core API Endpoints
        location / {
            limit_req zone=public_api_limit burst=20 nodelay;

            proxy_pass http://fintech_fastapi_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Propagate W3C Distributed Tracing Headers
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
