services:
  # FastAPI Application
  api:
    build: .
    container_name: fintech_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - N8N_API_KEY=${N8N_API_KEY}
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude '.venv/*'
    networks:
      - fintech_network

  # PostgreSQL Storage Engine
  db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d market_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: fintech_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintech_network

  # Redis Central Cache
  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - fintech_network

  # Load Testing Engine (Isolated)
  locust:
    image: locustio/locust
    container_name: fintech_locust
    ports:
      - "8089:8089"
    volumes:
      - ./app/scripts:/mnt/locust
    command: -f /mnt/locust/locustfile.py
    depends_on:
      - api
    networks:
      - fintech_network

  # n8n Automation Engine (Orchestration Layer)
  n8n:
    image: n8nio/n8n:latest
    container_name: fintech_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=sqlite
      - N8N_API_KEY=${N8N_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - fintech_network

# Persistent Storage
# Persistent Storage
volumes:
  postgres_data:
  n8n_data:

# Isolated Networking
networks:
  fintech_network:
    driver: bridge