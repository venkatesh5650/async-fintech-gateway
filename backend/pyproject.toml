[project]
name = "data-firewall"
version = "0.1.0"
description = "Enterprise-grade Asynchronous FinTech Data Ingestion Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic[email]>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "sqlalchemy (>=2.0.0)",
    "greenlet>=3.0.0",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-groq>=1.1.3",
    "redis>=5.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "pypdf>=5.0.0",
    "pgvector>=0.3.0",
    "locust>=2.20.0",
    "prometheus-client>=0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "W291",  # trailing whitespace in multi-line templates/raw strings
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/scripts/*" = ["F401", "E402"]

