version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Web & WebSocket API Gateway
  # ----------------------------------------------------------------------------
  - type: web
    name: fintech-api-gateway
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile.api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fintech-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_MARKET_POLLER
        value: "true"
      - key: MARKET_POLL_TICKERS
        value: "AAPL,MSFT,NVDA,TSLA,GOOGL"
      - key: MARKET_POLL_INTERVAL_SEC
        value: "30"
      - key: PYTHONIOENCODING
        value: "utf-8"

  # ----------------------------------------------------------------------------
  # 2. Background Stream Consumer Worker Daemon
  # ----------------------------------------------------------------------------
  - type: worker
    name: fintech-stream-worker
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile.worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fintech-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: fintech-api-gateway
          envVarKey: SECRET_KEY
      - key: PYTHONIOENCODING
        value: "utf-8"

  # ----------------------------------------------------------------------------
  # 3. Managed Redis 7 Central Cache & Message Broker
  # ----------------------------------------------------------------------------
  - type: redis
    name: fintech-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: volatile-lru

databases:
  # ----------------------------------------------------------------------------
  # 4. Managed PostgreSQL 15 Time-Series & pgvector Storage
  # ----------------------------------------------------------------------------
  - name: fintech-postgres
    databaseName: fintech_db
    user: admin
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
